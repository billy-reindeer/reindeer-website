# GitHub backend: no Netlify Identity / Git Gateway required.
# Decap commits content edits directly to the GitHub repo via the GitHub API.
# REQUIRES: this site is deployed from the GitHub repo named below, and a GitHub
# OAuth app is registered (see Netlify dashboard: Site settings > Access control > OAuth).
backend:
  name: github
  repo: billy-reindeer/reindeer-website   # owner: Billy's GitHub account. Repo must be named exactly this when created.
  branch: main

# Branding shown in the CMS: logo above the login button + a link back to the live site
site_url: https://reindeerpub.com
display_url: https://reindeerpub.com
logo_url: /reindeer-full.png

# Allows running the CMS against local files during development.
# Only takes effect on localhost (run: npx decap-server). Ignored in production.
local_backend: true

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: site_settings
    label: Site Settings
    files:
      - name: general
        label: General Settings
        file: _data/site-settings.json
        description: "Sitewide settings. Changes here update every page automatically (footer, homepage, gift voucher button) with no code changes needed."
        fields:
          - label: Homepage Headline
            name: hero_headline
            widget: string
            hint: "The big heading on the homepage, e.g. 'Bar Now Open'."
          - label: Homepage Subtext
            name: hero_subtext
            widget: string
            hint: "The line underneath the homepage headline."
          - label: Service Charge (%)
            name: service_charge_percent
            widget: string
            hint: "Number only, no % sign, e.g. 12. Shown in the footer on every page."
          - label: Gift Voucher Purchase Link
            name: gift_voucher_url
            widget: string
            hint: "The Toast e-gift card link used by the 'Buy a Gift Voucher' button."
          - label: Phone Number (displayed)
            name: phone_display
            widget: string
            hint: "e.g. 0115 934 6071"
          - label: Phone Number (link)
            name: phone_href
            widget: string
            hint: "The tel: link used when someone taps the number, e.g. tel:+441159346071"
          - label: Email Address (displayed)
            name: email
            widget: string
          - label: Email Address (link)
            name: email_href
            widget: string
            hint: "The mailto: link used when someone taps the email, e.g. mailto:hello@reindeerpub.com"
          - label: Address Line 1
            name: address_line1
            widget: string
          - label: Address Line 2
            name: address_line2
            widget: string
          - label: Instagram URL
            name: instagram_url
            widget: string
            hint: "Shown as the Instagram icon in the footer."
          - label: Facebook URL
            name: facebook_url
            widget: string
            hint: "Shown as the Facebook icon in the footer."
          - label: Opening Hours
            name: hours
            widget: list
            label_singular: Line
            summary: "{{fields.line}}"
            hint: "Each line appears in the footer, in order. Add, remove, or reorder lines as needed, e.g. for a bank holiday change."
            fields:
              - { label: Line, name: line, widget: string, hint: "e.g. Mon & Tue · Bar 4–9pm" }
          - label: Opening Hours Note
            name: hours_note
            widget: string
            required: false
            hint: "Shown as a smaller note under the hours, e.g. SHIO Terrace hours. Leave blank to hide."

  - name: events
    label: Events
    files:
      - name: all_events
        label: All Events
        file: _data/events.json
        fields:
          - label: Events
            name: events
            widget: list
            label_singular: Event
            summary: "{{fields.title}}, {{fields.date}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
              - { label: Time, name: time, widget: string, hint: "e.g. 7:00pm", required: false }
              - { label: Description, name: description, widget: text }
              - { label: Image, name: image, widget: image, required: false, hint: "Optional. Leave blank if no event image." }
              - { label: Button Label, name: cta_label, widget: string, default: "Book a table" }
              - { label: Button URL, name: cta_url, widget: string, default: "/book/" }
              - { label: Featured, name: featured, widget: boolean, default: false, hint: "Featured events show with a moss-coloured accent." }

  - name: menu
    label: Menu (Food)
    files:
      - name: main_menu
        label: Main Menu
        file: _data/menu.json
        description: "The main food menu. Groups appear in order, separated by spacing. No group headings are shown to guests."
        fields:
          - label: Menu Groups
            name: groups
            widget: list
            label_singular: Group
            summary: "{{fields.name}} ({{fields.items.length}} dishes)"
            fields:
              - { label: Group Name, name: name, widget: string, hint: "For your reference only. Not shown to guests on the page." }
              - label: Dishes
                name: items
                widget: list
                label_singular: Dish
                summary: "{{fields.name}}"
                required: false
                fields:
                  - { label: Dish Name, name: name, widget: string }
                  - { label: Description, name: description, widget: text, required: false }
                  - { label: Price, name: price, widget: string, hint: "e.g. 8.50 (no pound sign needed)" }

      - name: sunday_lunch
        label: Sunday Lunch Menu
        file: _data/sunday-lunch.json
        description: "The Sunday lunch menu. Course names (Starters, Mains, Puddings) are shown to guests."
        fields:
          - label: Set Menu Pricing
            name: price_note
            widget: list
            label_singular: Price Option
            summary: "{{fields.label}} — £{{fields.price}}"
            required: false
            hint: "Shown at the top of the page, e.g. '2 courses' / '34' and '3 courses' / '40'."
            fields:
              - { label: Label, name: label, widget: string, hint: "e.g. 2 courses" }
              - { label: Price, name: price, widget: string, hint: "e.g. 34 (no pound sign needed)" }
          - label: Courses
            name: courses
            widget: list
            label_singular: Course
            summary: "{{fields.name}} ({{fields.items.length}} dishes)"
            fields:
              - { label: Course Name, name: name, widget: string, hint: "Shown to guests as a heading, e.g. Starters." }
              - { label: Note, name: note, widget: text, required: false, hint: "Optional note shown under the heading, e.g. what roast dinners are served with." }
              - label: Dishes
                name: items
                widget: list
                label_singular: Dish
                summary: "{{fields.name}}"
                required: false
                fields:
                  - { label: Dish Name, name: name, widget: string }
                  - { label: Description, name: description, widget: text, required: false }
                  - { label: Price, name: price, widget: string, required: false, hint: "e.g. 16.00 (no pound sign needed). Leave blank if included in the set price." }

  - name: drinks
    label: Drinks
    files:
      - name: drinks_list
        label: Drinks List
        file: _data/drinks.json
        description: "The drinks list. Wine uses Glass/Bottle pricing. All other sections use a single price."
        fields:
          - label: Sections
            name: sections
            widget: list
            label_singular: Section
            summary: "{{fields.name}}"
            fields:
              - { label: Section Name, name: name, widget: string, hint: "Shown to guests as a heading, e.g. Wine." }
              - label: Format
                name: format
                widget: select
                options:
                  - { label: "Wine (Glass / Bottle pricing)", value: wine }
                  - { label: "Standard (single price)", value: list }
                default: list
                hint: "Choose Wine for glass and bottle pricing. Choose Standard for everything else."
              - label: Items
                name: items
                widget: list
                label_singular: Item
                summary: "{{fields.name}}"
                required: false
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Producer & Region, name: producer, widget: string, required: false, hint: "Wine only. e.g. Domaine de la Source, Loire." }
                  - { label: Description, name: description, widget: string, required: false, hint: "Standard items only (cocktails, beer, etc.)." }
                  - { label: Glass Price, name: glass, widget: string, required: false, hint: "Wine only. e.g. 6.50" }
                  - { label: Bottle Price, name: bottle, widget: string, required: false, hint: "Wine only. e.g. 26.00" }
                  - { label: Price, name: price, widget: string, required: false, hint: "Standard items only. e.g. 5.00" }
